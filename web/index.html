<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme-aware favicons: browsers that don't support the media/SVG icon
         fall back to the first matching link (black spark on light).
         ?v= busts the 7-day browser cache; bump it when files are replaced. -->
    <link
      rel="icon"
      type="image/png"
      media="(prefers-color-scheme: light)"
      href="/logo.png?v=v13"
    />
    <link
      rel="icon"
      type="image/png"
      media="(prefers-color-scheme: dark)"
      href="/logo-dark.png?v=v13"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>Po1nt9</title>
    <meta name="title" content="Po1nt9" />
    <meta name="description" content="Po1nt9 — AIGC. INSTANT." />

    <meta name="theme-color" content="#fff" />
    <!--umami-->

  </head>
