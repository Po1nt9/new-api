name: Publish Docker image (po1nt9 fork, amd64-only, GHCR)

on:
  push:
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (e.g., v1.0.0-rc.24-po1nt9.1)'
        required: true
        type: string

env:
  # 追上游 = git merge 新官方 tag 进 main 后，把这里 bump 成新 tag 名，
  # 并把该基线 tag push 到本 fork（CI checkout 只看 fork 仓库的 refs）
  UPSTREAM_BASE: v1.0.0-rc.25
  IMAGE: ghcr.io/po1nt9/new-api

jobs:
  guardrail:
    name: Guardrail - backend pristine (allowlist: invitation-code)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Fail if non-frontend files differ from upstream base (outside allowlist)
        run: |
          # 白名单 = 2026-08-19 特批上线的邀请码注册系统（ADR 0001）。
          # 其余非 web/ 文件与官方基线有差异即红；白名单文件内的上游合并仍需人工 review。
          CHANGED=$(git diff --name-only "${UPSTREAM_BASE}" HEAD -- \
            . ':!web' ':!.github/workflows' \
            ':!CONTEXT.md' ':!docs' ':!.husky' \
            ':!controller/invitation.go' ':!controller/misc.go' ':!controller/user.go' ':!controller/user_register_test.go' \
            ':!model/invitation.go' ':!model/invitation_test.go' ':!model/main.go' ':!model/option.go' ':!model/user.go' \
            ':!router/api-router.go' ':!common/constants.go' ':!i18n/keys.go' ':!i18n/locales')
          if [ -n "$CHANGED" ]; then
            echo "::error::Non-frontend files changed beyond allowlist vs ${UPSTREAM_BASE}:"
            echo "$CHANGED"
            exit 1
          fi
          echo "OK: only web/, workflows, docs, or allowlisted invitation-code files differ from ${UPSTREAM_BASE}"

  build:
    name: Build & push (linux/amd64)
    needs: [guardrail]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag & write VERSION
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$TAG' does not exist"
              exit 1
            fi
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "${TAG}" > VERSION
          echo "Building tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          {
            echo "### Docker Image (linux/amd64)"
            echo '${{ env.IMAGE }}:${{ env.TAG }}'
            echo "digest: ${{ steps.build.outputs.digest }}"
          } >> $GITHUB_STEP_SUMMARY
